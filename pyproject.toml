[project]
name = "py-similarity"
version = "0.1.0"
description = "Python library for computing Levenshtein distance and Jaro-Winkler similarity."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
